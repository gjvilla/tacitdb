[package]
name = "tacit-mcp"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
jiff = "0.2.35"
rmcp = { version = "3.1.4", features = ["server", "macros", "transport-io"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tacit-core = { path = "../tacit-core" }
tacit-keeper = { version = "0.1.0", path = "../tacit-keeper" }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-std"] }

[dev-dependencies]
serde_json = "1.0.151"
